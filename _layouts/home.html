---
layout: default
---

<style>
.header-canvas-wrapper {
  position: relative;
  background: var(--bg);
  /* Contain child margins so the canvas reaches right up to the navbar. */
  display: flow-root;
}

#glitter-canvas,
#glitter-stars {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.6;
}

/* the stars left behind by the glitter in dark mode, a bit brighter than the glitter */
#glitter-stars {
  opacity: 0.85;
}

.header-canvas-wrapper .header,
.header-canvas-wrapper .navbar-spacer {
  position: relative;
  z-index: 1;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const container = document.querySelector('.container');
  const header = container.querySelector('.header');
  const spacer = container.querySelector('.navbar-spacer');
  const navbar = container.querySelector('.navbar');

  const wrapper = document.createElement('div');
  wrapper.className = 'header-canvas-wrapper';

  const canvas = document.createElement('canvas');
  canvas.id = 'glitter-canvas';
  // Own canvas for the stars: the glitter canvas is never cleared, only faded, so stars
  // redrawn on it every frame would pile up into solid blobs.
  const starCanvas = document.createElement('canvas');
  starCanvas.id = 'glitter-stars';

  container.insertBefore(wrapper, header);
  wrapper.appendChild(canvas);
  wrapper.appendChild(starCanvas);
  wrapper.insertBefore(header, starCanvas.nextSibling);
  wrapper.appendChild(spacer);
  // Keep navbar outside wrapper so CSS position: sticky works correctly.
  container.insertBefore(navbar, wrapper.nextSibling);

  (function () {
    const ctx = canvas.getContext('2d');
    const starCtx = starCanvas.getContext('2d');
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      // Use wrapper's CSS size and scale canvas backing store by devicePixelRatio.
      const cssWidth = Math.max(1, wrapper.clientWidth);
      const cssHeight = Math.max(1, wrapper.clientHeight);
      [[canvas, ctx], [starCanvas, starCtx]].forEach(([c, context]) => {
        c.style.width = cssWidth + 'px';
        c.style.height = cssHeight + 'px';
        c.width = Math.floor(cssWidth * dpr);
        c.height = Math.floor(cssHeight * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0); // scale drawing operations
      });
    }

    // Ensure initial sizing after layout/paint (fixes first-load offset issues).
    resize();
    // Also resize on next animation frame to catch late layout changes.
    requestAnimationFrame(resize);

    // Keep canvas size in sync with container changes
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
        dpr = window.devicePixelRatio || 1;
        resize();
      });
      ro.observe(wrapper);
    } else {
      window.addEventListener('resize', () => {
        dpr = window.devicePixelRatio || 1;
        resize();
      });
    }

    let mouseX = 0, mouseY = 0;
    let mouseActive = false;

    function sparkleAt(clientX, clientY) {
      const rect = wrapper.getBoundingClientRect();
      // Use CSS pixel coordinates here. The context is scaled by DPR (ctx.setTransform)
      // so drawing code can work in CSS pixels and remain crisp on high-DPI displays.
      mouseX = clientX - rect.left;
      mouseY = clientY - rect.top;
      // Ignore touches that have moved outside the header area.
      if (mouseX < 0 || mouseY < 0 || mouseX > rect.width || mouseY > rect.height) return;
      mouseActive = true;
      // Only 2 particles per move — slow trickle, not explosion
      if (Math.random() < 3) {
        particles.push(createParticle(mouseX, mouseY));
      }
    }

    wrapper.addEventListener('mousemove', (e) => sparkleAt(e.clientX, e.clientY));
    wrapper.addEventListener('mouseleave', () => {
      mouseActive = false;
    });

    // Touch screens: sparkle while swiping, not only on tap. Passive listeners
    // so the page still scrolls normally.
    function onTouch(e) {
      for (const t of e.touches) sparkleAt(t.clientX, t.clientY);
    }
    wrapper.addEventListener('touchstart', onTouch, { passive: true });
    wrapper.addEventListener('touchmove', onTouch, { passive: true });
    wrapper.addEventListener('touchend', () => {
      mouseActive = false;
    });

    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';

    let hue = 0;
    let particles = [];
    let wasDark = isDark();

    // Dark mode: now and then a glitter particle settles and stays on the background as a
    // star. Past MAX_STARS the oldest ones fade out again, so the header never fills up.
    const STICK_CHANCE = 0.06;
    const STICK_ALPHA = 0.8;   // a sticking particle turns into a star once it has faded to this
    const MAX_STARS = 120;
    let stars = [];

    // dark mode glitter in the colours of the Milky Way navbar, defined once in
    // libs/custom/theme_animations.js (a deferred script, so it has run by now);
    // plain white if that script didn't load
    const MILKY_WAY = window.MILKY_WAY || [[255, 255, 255]];
    const rgb = (c, a = 1) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
    // halfway to white, for the stars, which stay paler than the glitter
    const paler = c => c.map(v => Math.round(v + (255 - v) * 0.5));

    // The dark mode fade runs every third frame only, but stronger: at 6% per frame the
    // faintest pixels round to themselves and never leave (a grey haze where the glitter
    // was); at 17% the remainder is too faint to see.
    const DARK_FADE = 0.17, DARK_FADE_EVERY = 3;
    let frame = 0;

    function createParticle(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 0.6 + 0.1;  // very slow
      const size = Math.random() + 1;
      return {
        // Keep particle coordinates in CSS pixels (context is already scaled)
        x: x + (Math.random() - 0.5) * 13,  // small spread around cursor
        y: y + (Math.random() - 0.5) * 13,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,   // centered
        size,
        hue: (hue + Math.random() * 60 - 30 + 360) % 360,
        alpha: Math.random() * 0.5 + 0.5,    // start at varying opacity
        decay: Math.random() * 0.06 + 0.003, // very slow fade
        shimmerPhase: Math.random() * Math.PI * 2,
        shimmerSpeed: Math.random() * 0.04 + 0.01,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.02,
        tint: MILKY_WAY[Math.floor(Math.random() * MILKY_WAY.length)],
        sticks: isDark() && Math.random() < STICK_CHANCE,
      };
    }

    function drawParticle(p, dark) {
      const twinkle = 0.6 + 0.4 * Math.sin(p.shimmerPhase);
      ctx.save();
      ctx.globalAlpha = p.alpha * twinkle;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);

      // rainbow in light mode, Milky Way colours around a white centre in dark mode
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 2);
      if (dark) {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, rgb(p.tint));
        grad.addColorStop(1, rgb(p.tint, 0));
      } else {
        grad.addColorStop(0, `hsl(${p.hue}, 100%, 98%)`);
        grad.addColorStop(0.3, `hsl(${p.hue}, 100%, 75%)`);
        grad.addColorStop(1, `hsla(${p.hue}, 100%, 60%, 0)`);
      }

      ctx.fillStyle = grad;

      // Soft 4-point star
      const s = p.size;
      ctx.beginPath();
      ctx.moveTo(0, -s * 2.2);
      ctx.quadraticCurveTo(s * 0.3, -s * 0.3, s * 2.2, 0);
      ctx.quadraticCurveTo(s * 0.3, s * 0.3, 0, s * 2.2);
      ctx.quadraticCurveTo(-s * 0.3, s * 0.3, -s * 2.2, 0);
      ctx.quadraticCurveTo(-s * 0.3, -s * 0.3, 0, -s * 2.2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function stickAsStar(p) {
      stars.push({
        x: p.x,
        y: p.y,
        r: 0.45 + p.size * 0.35,
        tint: paler(p.tint),
        alpha: 0,   // fades in from the settling particle
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.03 + 0.01,
        leaving: false,
      });
      // past the limit the oldest star that isn't already leaving fades out
      const staying = stars.filter(s => !s.leaving);
      if (staying.length > MAX_STARS) staying[0].leaving = true;
    }

    // a small dot with a soft glow, twinkling gently
    function drawStar(s) {
      s.phase += s.speed;
      s.alpha = s.leaving ? s.alpha - 0.01 : Math.min(1, s.alpha + 0.05);
      starCtx.globalAlpha = Math.max(0, s.alpha) * (0.7 + 0.3 * Math.sin(s.phase));
      const glow = starCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
      glow.addColorStop(0, '#ffffff');
      glow.addColorStop(0.3, rgb(s.tint, 0.6));
      glow.addColorStop(1, rgb(s.tint, 0));
      starCtx.fillStyle = glow;
      starCtx.beginPath();
      starCtx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      starCtx.fill();
    }

    function animate() {
      // Very slow fade so sparkles linger softly. In dark mode the canvas fades to
      // transparent instead: painting the dark background at this low alpha never
      // quite reaches it (8-bit rounding) and leaves the header darker than the page.
      const dark = isDark();
      // After switching to dark mode the white the light mode has built up would never
      // fade out completely either (same rounding), so start from an empty canvas.
      if (dark && !wasDark) {
        ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
      }
      // the stars belong to the night sky; they go when switching to light mode
      if (!dark) stars = [];
      wasDark = dark;
      frame++;
      if (!dark || frame % DARK_FADE_EVERY === 0) {
        ctx.globalCompositeOperation = dark ? 'destination-out' : 'source-over';
        ctx.fillStyle = dark ? `rgba(0, 0, 0, ${DARK_FADE})` : 'rgba(255, 255, 255, 0.06)';
        // canvas.width/height are device pixels; because the context is scaled by DPR
        // we draw using CSS-pixel dimensions (device / dpr)
        ctx.fillRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
        ctx.globalCompositeOperation = 'source-over';
      }

      hue = (hue + 0.5) % 360;  // slow rainbow cycle

      starCtx.clearRect(0, 0, starCanvas.width / (window.devicePixelRatio || 1), starCanvas.height / (window.devicePixelRatio || 1));
      stars = stars.filter(s => s.alpha > 0 || !s.leaving);
      stars.forEach(drawStar);
      starCtx.globalAlpha = 1;

      particles = particles.filter(p => {
        if (p.sticks && dark && p.alpha <= STICK_ALPHA) {
          stickAsStar(p);
          return false;
        }
        return p.alpha > 0.01;
      });

      particles.forEach(p => {
        p.shimmerPhase += p.shimmerSpeed;
        p.rotation += p.rotationSpeed;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.vy -= 0.0;  // very gentle continuous upward float
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        drawParticle(p, dark);
      });

      requestAnimationFrame(animate);
    }

    animate();
  })();
});
</script>
