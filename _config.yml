source:      .
destination: ./_site
includes:    ./_includes
url: "https://nelebru.github.io"
baseurl: ""

# used by jekyll-seo-tag for <title>, description, Open Graph and canonical links;
# pages can override description (and image) in their front matter
title: "Nele Brügge"
description: "Personal website of Nele Brügge, researcher and PhD student at DFKI and the University of Luebeck, working on machine learning, differential privacy and representation learning in medical AI."
lang: en
author: "Nele Brügge"
social:
  name: "Nele Brügge"
  links:
    - "https://www.linkedin.com/in/nele-brügge"
    - "https://github.com/nelebru"
    - "https://scholar.google.com/citations?user=jhTOT58AAAAJ"
    - "https://www.researchgate.net/profile/Nele-Bruegge"

# Cloudflare Worker from _likes-worker/ (hearts on courses and recipes); leave empty to hide the hearts
likes_api: "https://course-likes.nele-bruegge.workers.dev/likes"

# Vita as a bike ride: "dots" (minimal dotted mountains and sea, libs/custom/vita_ride_dots.js)
# or "landscape" (colourful fields and trees, libs/custom/vita_ride.js)
vita_ride: "dots"
# only for "dots": true lets the rider first surf in on the waves and jump onto the bike
vita_ride_surf: true
# only for "dots": "pollenca-lluc" for the real road and mountains from Port de Pollença to
# Lluc on Mallorca (libs/custom/vita_ride_pollenca_lluc.js), "made-up" for the generated ones
vita_ride_terrain: "pollenca-lluc"
# true: scroll effects on the home page and recipes (libs/custom/scroll_fx.js and .css): wave lines
# beside the section headings, and tiles, papers and headings sliding in as they come into view
scroll_fx: true
# true: overview map on the GPX page with all courses of one place on top of each other and a
# list to hover them (libs/custom/gpx_overview.js and .css; the lines come from
# create_map/gpx_overview.py, rerun it after adding courses)
gpx_overview: true


collections:
  projects:
    output: true
  recipes:
    output: true

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
